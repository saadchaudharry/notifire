[project]
name = "notifire"
authors = [{ name = "Notifire", email = "support@example.com" }]
description = "Frappe Cloud webhook receiver + notification routing as a custom Frappe app (DocTypes + Desk UI)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0"
